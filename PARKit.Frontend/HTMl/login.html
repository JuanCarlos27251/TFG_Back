<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión — PARKit</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="../JS/config.js"></script>
    <script src="../JS/global.js"></script>
    <script src="../JS/auth.js"></script>
    <link rel="stylesheet" href="../STYLES/global.css" />
</head>

<body class="layout-base">

    <!-- CABECERA -->
    <header class="header-base">
        <div class="max-w-6xl mx-auto flex items-center justify-between px-6 py-4">
            <a href="index.html" class="flex items-center gap-2 texto-primario font-black text-xl tracking-tight">
                <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 48 48" aria-hidden="true">
                    <path clip-rule="evenodd" fill-rule="evenodd"
                          d="M24 18.4228L42 11.475V34.3663C42 34.7796 41.7457 35.1504 41.3601 35.2992L24 42V18.4228Z"/>
                    <path clip-rule="evenodd" fill-rule="evenodd"
                          d="M24 8.18819L33.4123 11.574L24 15.2071L14.5877 11.574L24 8.18819ZM9 15.8487L21 20.4805V37.6263L9 32.9945V15.8487ZM27 37.6263V20.4805L39 15.8487V32.9945L27 37.6263ZM25.354 2.29885C24.4788 1.98402 23.5212 1.98402 22.646 2.29885L4.98454 8.65208C3.7939 9.08038 3 10.2097 3 11.475V34.3663C3 36.0196 4.01719 37.5026 5.55962 38.098L22.9197 44.7987C23.6149 45.0671 24.3851 45.0671 25.0803 44.7987L42.4404 38.098C43.9828 37.5026 45 36.0196 45 34.3663V11.475C45 10.2097 44.2061 9.08038 43.0155 8.65208L25.354 2.29885Z"/>
                </svg>
                PARKit
            </a>
        </div>
    </header>

    <!-- Botón volver -->
    <div class="fixed top-[65px] left-0 p-4 md:p-6 z-50">
        <a href="index.html"
           class="btn btn-ghost btn-sm inline-flex items-center gap-1 bg-white/80 dark:bg-[#0e1120]/80 backdrop-blur-md border border-[var(--borde)] shadow-sm md:bg-transparent md:dark:bg-transparent md:backdrop-blur-none md:border-none md:shadow-none">
            <span class="material-symbols-outlined text-sm">arrow_back</span>
            Volver al inicio
        </a>
    </div>

    <main class="flex-1 flex items-center justify-center px-6 py-8">
        <div class="card w-full max-w-md p-8 flex flex-col gap-6 aparecer">

            <!-- Logo + título -->
            <div class="flex flex-col items-center gap-3 text-center">
                <a href="index.html" class="flex items-center gap-2 text-primario font-black text-2xl tracking-tight">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 48 48">
                        <path clip-rule="evenodd" d="M24 18.4228L42 11.475V34.3663C42 34.7796 41.7457 35.1504 41.3601 35.2992L24 42V18.4228Z" fill-rule="evenodd"/>
                        <path clip-rule="evenodd" d="M24 8.18819L33.4123 11.574L24 15.2071L14.5877 11.574L24 8.18819ZM9 15.8487L21 20.4805V37.6263L9 32.9945V15.8487ZM27 37.6263V20.4805L39 15.8487V32.9945L27 37.6263ZM25.354 2.29885C24.4788 1.98402 23.5212 1.98402 22.646 2.29885L4.98454 8.65208C3.7939 9.08038 3 10.2097 3 11.475V34.3663C3 36.0196 4.01719 37.5026 5.55962 38.098L22.9197 44.7987C23.6149 45.0671 24.3851 45.0671 25.0803 44.7987L42.4404 38.098C43.9828 37.5026 45 36.0196 45 34.3663V11.475C45 10.2097 44.2061 9.08038 43.0155 8.65208L25.354 2.29885Z" fill-rule="evenodd"/>
                    </svg>
                    PARKit
                </a>
                <div>
                    <h1 class="text-xl font-bold tracking-tight mt-2">¡Hola de nuevo!</h1>
                    <p class="text-sm text-[var(--texto-suave)] mt-1">Accede a tu cuenta de conductor o empresa</p>
                </div>
            </div>

            <!-- Tabs usuario / empresa -->
            <div class="flex p-1 rounded-xl bg-[#f5f6fa] dark:bg-[#0e1120] border border-[var(--borde)]">
                <button
                    type="button"
                    id="tab-usuario"
                    class="flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-white dark:bg-[#161b2e] shadow-sm text-primario"
                >
                    Soy Conductor
                </button>
                <button
                    type="button"
                    id="tab-empresa"
                    class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-[var(--texto-suave)] hover:text-[#111318] dark:hover:text-white"
                >
                    Soy Empresa
                </button>
            </div>

            <!-- Formulario de login -->
            <form id="form-login" class="flex flex-col gap-4" novalidate>

                <!-- Campo email -->
                <div class="flex flex-col gap-1.5">
                    <label for="login-email"
                           class="text-xs font-semibold uppercase tracking-wider text-[var(--texto-suave)]">
                        Correo electrónico
                    </label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-sm text-[var(--texto-suave)]">mail</span>
                        <input
                            type="email"
                            id="login-email"
                            required
                            placeholder="ejemplo@correo.com"
                            autocomplete="email"
                            class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-[var(--borde)] bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-primario/20 focus:border-primario transition-colors placeholder:text-[var(--texto-suave)]/50"
                        />
                    </div>
                </div>

                <!-- Campo contraseña -->
                <div class="flex flex-col gap-1.5">
                    <div class="flex justify-between items-center">
                        <label for="login-password"
                               class="text-xs font-semibold uppercase tracking-wider text-[var(--texto-suave)]">
                            Contraseña
                        </label>
                        <a href="#" class="text-xs font-medium text-primario hover:underline">¿La has olvidado?</a>
                    </div>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-sm text-[var(--texto-suave)]">lock</span>
                        <input
                            type="password"
                            id="login-password"
                            required
                            placeholder="••••••••"
                            autocomplete="current-password"
                            class="w-full pl-10 pr-10 py-2.5 rounded-lg border border-[var(--borde)] bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-primario/20 focus:border-primario transition-colors placeholder:text-[var(--texto-suave)]/50"
                        />
                        <!-- Toggle mostrar contraseña -->
                        <button
                            type="button"
                            id="btn-ver-password"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--texto-suave)] hover:text-[var(--texto)] transition-colors"
                            aria-label="Mostrar contraseña"
                        >
                            <span class="material-symbols-outlined text-sm" id="icono-ver-password">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Recordar sesión -->
                <div class="flex items-center gap-2 my-1">
                    <input
                        type="checkbox"
                        id="login-recordar"
                        class="rounded border-[var(--borde)] text-primario focus:ring-primario bg-transparent w-4 h-4"
                    />
                    <label for="login-recordar"
                           class="text-sm text-[var(--texto-suave)] select-none cursor-pointer">
                        Recordar mi sesión
                    </label>
                </div>

                <!-- Mensaje de error -->
                <p id="login-error"
                   class="hidden text-sm text-[var(--rojo)] font-medium text-center bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900/40 rounded-lg px-4 py-2.5">
                </p>

                <!-- Botón submit -->
                <button type="submit" id="btn-login" class="btn btn-primario btn-lg w-full mt-2">
                    <span class="material-symbols-outlined text-base" id="icono-btn-login">login</span>
                    <span id="texto-btn-login">Iniciar sesión</span>
                </button>
            </form>

            <div class="h-px bg-[var(--borde)] w-full"></div>

            <!-- Enlace a registro -->
            <p class="text-sm text-[var(--texto-suave)] text-center" id="pie-login">
                ¿Aún no tienes cuenta?
                <a href="registro.html" class="text-primario font-bold hover:underline ml-1">Regístrate gratis</a>
            </p>

        </div>
    </main>

    <footer class="py-6 text-center text-xs text-[var(--texto-suave)] border-t border-[var(--borde)] bg-white/50 dark:bg-[#0e1120]/50 backdrop-blur-sm">
        <p>© 2026 PARKit — TFG DAW · Juan Carlos Pina Esteban</p>
    </footer>

    <div id="contenedor-toast"></div>

    <script>
    (() => {
        //  Estado del formulario 
        let modoActual = 'usuario'; // 'usuario' | 'empresa'

        //  Redirigir si ya hay sesión activa 
        if (AUTH.estaAutenticado()) {
            const rolActual = localStorage.getItem('parkit_rol');
            if (rolActual === 'empresa') window.location.href = './EMPRESA/panelEmpresa.html';
            else if (rolActual === 'Admin') window.location.href = 'panelAdmin.html';
            else window.location.href = 'index.html';
        }

        //  Referencias 
        const tabUsuario  = document.getElementById('tab-usuario');
        const tabEmpresa  = document.getElementById('tab-empresa');
        const formLogin   = document.getElementById('form-login');
        const errorEl     = document.getElementById('login-error');
        const btnLogin    = document.getElementById('btn-login');
        const textoBtn    = document.getElementById('texto-btn-login');
        const iconoBtn    = document.getElementById('icono-btn-login');
        const pieLogin    = document.getElementById('pie-login');

        //  Toggle contraseña visible 
        document.getElementById('btn-ver-password')?.addEventListener('click', () => {
            const input  = document.getElementById('login-password');
            const icono  = document.getElementById('icono-ver-password');
            const visible = input.type === 'text';
            input.type   = visible ? 'password' : 'text';
            icono.textContent = visible ? 'visibility' : 'visibility_off';
        });

        //  Cambio de tab 
        function activarTab(modo) {
            modoActual = modo;
            const esEmpresa = modo === 'empresa';

            // Estilos activo / inactivo
            const clsActivo   = ['bg-white', 'dark:bg-[#161b2e]', 'shadow-sm', 'text-primario'];
            const clsInactivo = ['text-[var(--texto-suave)]', 'hover:text-[#111318]', 'dark:hover:text-white'];

            if (esEmpresa) {
                tabEmpresa.classList.add(...clsActivo);
                tabEmpresa.classList.remove(...clsInactivo);
                tabUsuario.classList.remove(...clsActivo);
                tabUsuario.classList.add(...clsInactivo);
            } else {
                tabUsuario.classList.add(...clsActivo);
                tabUsuario.classList.remove(...clsInactivo);
                tabEmpresa.classList.remove(...clsActivo);
                tabEmpresa.classList.add(...clsInactivo);
            }

            // Adaptar pie de página
            pieLogin.innerHTML = esEmpresa
                ? `¿No tienes cuenta de empresa? <a href="registro.html?tipo=empresa" class="text-primario font-bold hover:underline ml-1">Registra tu empresa</a>`
                : `¿Aún no tienes cuenta? <a href="registro.html" class="text-primario font-bold hover:underline ml-1">Regístrate gratis</a>`;

            ocultarError();
        }

        tabUsuario.addEventListener('click', () => activarTab('usuario'));
        tabEmpresa.addEventListener('click', () => activarTab('empresa'));

        //  Mostrar / ocultar error 
        function mostrarError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.remove('hidden');
        }

        function ocultarError() {
            errorEl.textContent = '';
            errorEl.classList.add('hidden');
        }

        //  Estado de carga del botón 
        function setCargando(activo) {
            btnLogin.disabled       = activo;
            iconoBtn.textContent    = activo ? 'hourglass_top' : 'login';
            textoBtn.textContent    = activo ? 'Iniciando sesión...' : 'Iniciar sesión';
            if (activo) iconoBtn.classList.add('animate-spin');
            else        iconoBtn.classList.remove('animate-spin');
        }

        //  Envío del formulario 
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            ocultarError();

            const email    = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                mostrarError('Por favor, completa todos los campos.');
                return;
            }

            setCargando(true);

            try {
                if (modoActual === 'usuario') {
                    const info = await AUTH.loginUsuario(email, password);
                    // Si el usuario recién logueado tiene rol Admin, va al panel global
                    if (info.rol === 'Admin') {
                        window.location.href = 'panelAdmin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    await AUTH.loginEmpresa(email, password);
                    window.location.href = 'EMPRESA/panelEmpresa.html';
                }
            } catch (err) {
                mostrarError(err.message || 'Credenciales incorrectas. Inténtalo de nuevo.');
                setCargando(false);
            }
        });

        //  Pre-seleccionar tab empresa si viene por URL 
        // Ej: login.html?tipo=empresa (desde el panel de empresas)
        const params = new URLSearchParams(window.location.search);
        if (params.get('tipo') === 'empresa') activarTab('empresa');

    })();
    </script>

</body>
</html>
