<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Parkings — PARKit Business</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <!-- Scripts base de PARKit -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script src="../../JS/auth.js"></script>
    <script src="../../JS/global.js"></script>
    <link rel="stylesheet" href="../../STYLES/global.css" />
    <link rel="stylesheet" href="../../STYLES/empresas.css" />
</head>

<body class="layout-base tema-business md:flex-row">

    <!--  Sidebar  -->
    <aside class="w-full md:w-64 bg-[var(--fondo-card)] border-r border-[var(--borde)] flex flex-col justify-between p-5 md:sticky md:top-0 md:h-screen z-40 shadow-lg md:shadow-none">
        <div class="flex flex-col gap-8">
            <a href="../index.html" class="flex items-center gap-3 px-2 text-[var(--texto)] font-black text-xl tracking-tight">
                <div class="bg-[var(--primario)] rounded-xl w-10 h-10 flex items-center justify-center text-white flex-shrink-0 shadow-lg shadow-[var(--primario)]/30">
                    <span class="material-symbols-outlined icono-relleno">local_parking</span>
                </div>
                <div class="flex flex-col">
                    <span class="leading-none">PARKit</span>
                    <span class="text-[10px] text-[var(--primario)] uppercase tracking-wider mt-1">Negocios</span>
                </div>
            </a>

            <nav class="flex flex-col gap-1.5">
                <a href="panelEmpresa.html" class="nav-item ">
                    <span class="material-symbols-outlined">dashboard</span>
                    Panel de Control
                </a>
                <a href="misparkingsEmpresa.html" class="nav-item activo">
                    <span class="material-symbols-outlined">directions_car</span>
                    Mis Parkings
                </a>
                <a href="estadisticasEmpresa.html" class="nav-item">
                    <span class="material-symbols-outlined">bar_chart</span>
                    Estadísticas
                </a>
                <a href="configuracionEmpresa.html" class="nav-item">
                    <span class="material-symbols-outlined">settings</span>
                    Configuración
                </a>
            </nav>
        </div>

        <div class="mt-8 flex flex-col gap-2">
            <button id="btn-logout-empresa" class="btn btn-ghost w-full text-sm text-[var(--rojo)]">
                <span class="material-symbols-outlined text-[18px]">logout</span>
                Cerrar sesión
            </button>
        </div>
    </aside>

    <!-- ── CONTENIDO PRINCIPAL ──────────────────────────────────── -->
    <div class="flex-1 flex flex-col min-w-0">

        <!-- Header -->
        <header class="header-base flex items-center justify-between px-6 py-4 lg:px-10 z-30">
            <div class="flex items-center gap-6 flex-1">
                <h2 class="text-xl font-bold tracking-tight hidden sm:block">Mis Parkings</h2>

                <div class="relative w-full max-w-md">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[var(--texto-suave)] text-xl">search</span>
                    <input type="text" id="buscador-parking" class="input-base input-con-icono bg-[var(--fondo)]" placeholder="Buscar parking por nombre o dirección..." />
                </div>
            </div>

            <div class="flex items-center gap-4 ml-4">
                <div class="flex items-center gap-3 pl-4 border-l border-[var(--borde)] cursor-pointer">
                    <div class="text-right hidden sm:block">
                        <p id="header-empresa-nombre" class="text-sm font-bold leading-none">Cargando...</p>
                        <p id="header-empresa-subtitulo" class="text-[11px] text-[var(--texto-suave)] mt-1"></p>
                    </div>
                    <div id="header-empresa-avatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-[var(--primario)] to-[var(--primario-oscuro)] flex items-center justify-center text-white font-bold shadow-md">
                        …
                    </div>
                </div>
            </div>
        </header>

        <!-- Main -->
        <main class="p-6 lg:p-10 flex flex-col gap-8 flex-1 max-w-[1400px] mx-auto w-full mb-10">

            <!-- Título + acción -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
                <div>
                    <h3 class="text-2xl font-black tracking-tight text-[var(--texto)]">Tus Instalaciones</h3>
                    <p class="text-sm text-[var(--texto-suave)] mt-1" id="parking-count">Cargando parkings...</p>
                </div>
                <a href="addparkingEmpresa.html" class="btn btn-primario text-sm flex items-center gap-2 shadow-lg shadow-[var(--primario)]/20">
                    <span class="material-symbols-outlined text-[20px]">add_circle</span>
                    Añadir Parking
                </a>
            </div>

            <!-- Filtros rápidos -->
            <div class="flex flex-wrap items-center gap-3" id="filtros-parking">
                <button data-filter="all" class="filtro-btn activo flex items-center gap-1.5 px-4 py-2 rounded-lg bg-[var(--primario)] text-white text-xs font-bold uppercase tracking-wider transition-all">
                    Todos
                </button>
                <button data-filter="active" class="filtro-btn flex items-center gap-1.5 px-4 py-2 rounded-lg bg-[var(--fondo-card)] border border-[var(--borde)] text-[var(--texto-suave)] text-xs font-bold uppercase tracking-wider hover:border-[var(--primario)] hover:text-[var(--primario)] transition-all">
                    <span class="w-2 h-2 rounded-full bg-[var(--verde)] flex-shrink-0"></span> Activos
                </button>
                <button data-filter="inactive" class="filtro-btn flex items-center gap-1.5 px-4 py-2 rounded-lg bg-[var(--fondo-card)] border border-[var(--borde)] text-[var(--texto-suave)] text-xs font-bold uppercase tracking-wider hover:border-[var(--primario)] hover:text-[var(--primario)] transition-all">
                    <span class="w-2 h-2 rounded-full bg-[var(--rojo)] flex-shrink-0"></span> Inactivos
                </button>
            </div>

            <!-- Grid de tarjetas de parkings -->
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6" id="parking-grid">
                <!-- Se inyectarán dinámicamente desde JS -->
            </div>

        </main>
    </div>

    <!-- Toast container -->
    <div id="contenedor-toast" class="fixed bottom-6 right-6 flex flex-col gap-2 z-[100]"></div>

    <!-- Script de lógica -->
    <script src="../../JS/parkingsEmpresa.js"></script>
</body>
</html>
