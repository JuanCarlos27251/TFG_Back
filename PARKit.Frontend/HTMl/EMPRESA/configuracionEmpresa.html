<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración - PARKit Business</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="../../JS/auth.js"></script>
    <script src="../../JS/global.js"></script>
    <link rel="stylesheet" href="../../STYLES/global.css" />
    <link rel="stylesheet" href="../../STYLES/empresas.css" />
</head>

<body class="layout-base tema-business md:flex-row">

    <!-- ── Sidebar ──────────────────────────────────────────── -->
    <aside class="w-full md:w-64 bg-[var(--fondo-card)] border-r border-[var(--borde)] flex flex-col justify-between p-5 md:sticky md:top-0 md:h-screen z-40 flex-shrink-0">
        <div class="flex flex-col gap-8">
            <a href="../index.html" class="flex items-center gap-3 px-2 text-[var(--texto)] font-black text-xl tracking-tight">
                <div class="bg-[var(--primario)] rounded-xl w-10 h-10 flex items-center justify-center text-white flex-shrink-0 shadow-lg shadow-[var(--primario)]/30">
                    <span class="material-symbols-outlined icono-relleno">local_parking</span>
                </div>
                <div class="flex flex-col">
                    <span class="leading-none">PARKit</span>
                    <span class="text-[10px] text-[var(--primario)] uppercase tracking-wider mt-1">Negocios</span>
                </div>
            </a>

            <nav class="flex flex-col gap-1.5">
                <a href="panelEmpresa.html" class="nav-item">
                    <span class="material-symbols-outlined">dashboard</span>
                    Panel de Control
                </a>
                <a href="misparkingsEmpresa.html" class="nav-item">
                    <span class="material-symbols-outlined">directions_car</span>
                    Mis Parkings
                </a>
                <a href="estadisticasEmpresa.html" class="nav-item">
                    <span class="material-symbols-outlined">bar_chart</span>
                    Estadísticas
                </a>
                <a href="configuracionEmpresa.html" class="nav-item activo">
                    <span class="material-symbols-outlined">settings</span>
                    Configuración
                </a>
            </nav>
        </div>

        <div class="mt-8 flex flex-col gap-2">
            <button id="btn-logout-empresa" class="btn btn-ghost w-full text-sm text-[var(--rojo)]">
                <span class="material-symbols-outlined text-[18px]">logout</span>
                Cerrar sesión
            </button>
        </div>
    </aside>

    <!-- ── Contenido principal ──────────────────────────────── -->
    <div class="flex-1 flex flex-col min-w-0">

        <!-- Header -->
        <header class="header-base flex items-center justify-between px-6 py-4 lg:px-10 z-30">
            <div class="flex items-center gap-6 flex-1">
                <h2 class="text-xl font-bold tracking-tight hidden sm:block">Ajustes</h2>
            </div>

            <div class="flex items-center gap-4 ml-4">
                <div class="flex items-center gap-3 pl-4 border-l border-[var(--borde)]">
                    <div class="text-right hidden sm:block">
                        <p id="header-empresa-nombre" class="text-sm font-bold leading-none">Cargando...</p>
                        <p id="header-empresa-subtitulo" class="text-[11px] text-[var(--texto-suave)] mt-1"></p>
                    </div>
                    <div id="header-empresa-avatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-[var(--primario)] to-[var(--primario-oscuro)] flex items-center justify-center text-white font-bold shadow-md">
                        …
                    </div>
                </div>
            </div>
        </header>

        <!-- Cuerpo -->
        <main class="p-6 lg:p-10 flex flex-col gap-6 flex-1 max-w-[1000px] w-full mx-auto">

            <div>
                <h3 class="text-2xl font-black tracking-tight text-[var(--texto)]">Configuración de la Empresa</h3>
                <p class="text-sm text-[var(--texto-suave)] mt-1">Gestiona los datos de facturación, contacto y credenciales de tu cuenta corporativa.</p>
            </div>

            <div class="card p-6 md:p-8 mt-2">
                <form class="flex flex-col gap-6" onsubmit="return false;">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <div class="flex flex-col gap-2">
                            <label for="setting-company-name" class="label-settings">Nombre de la Empresa</label>
                            <input type="text" id="setting-company-name" class="input-base bg-[var(--fondo)]"
                                   placeholder="Ej. PARKit S.L." required />
                        </div>

                        <div class="flex flex-col gap-2">
                            <label for="setting-cif" class="label-settings">CIF / NIF</label>
                            <input type="text" id="setting-cif" class="input-base bg-[var(--fondo)]"
                                   placeholder="Ej. B12345678" required />
                        </div>

                        <div class="flex flex-col gap-2">
                            <label for="setting-email" class="label-settings">Correo Electrónico de Contacto</label>
                            <input type="email" id="setting-email" class="input-base bg-[var(--fondo)]"
                                   placeholder="empresa@parkit.com" required />
                        </div>

                        <div class="flex flex-col gap-2">
                            <label for="setting-phone" class="label-settings">Teléfono de Contacto</label>
                            <input type="tel" id="setting-phone" class="input-base bg-[var(--fondo)]"
                                   placeholder="+34 600 000 000" />
                        </div>

                        <div class="flex flex-col gap-2 md:col-span-2">
                            <label for="setting-address" class="label-settings">Dirección Fiscal</label>
                            <input type="text" id="setting-address" class="input-base bg-[var(--fondo)]"
                                   placeholder="Ej. Calle Mayor 1, Zaragoza" />
                        </div>

                    </div>

                    <div class="border-t border-[var(--borde)] pt-6 mt-2 flex justify-end gap-3">
                        <button type="button" id="btn-cancelar-config" class="btn btn-ghost text-sm px-5">
                            Cancelar
                        </button>
                        <button type="button" id="btn-guardar-config" class="btn btn-primario text-sm px-6">
                            Guardar Cambios
                        </button>
                    </div>

                </form>
            </div>

        </main>
    </div>

    <!-- Toast container -->
    <div id="contenedor-toast" class="fixed bottom-6 right-6 flex flex-col gap-2 z-[100]"></div>

    <script src="../../JS/empresa.js"></script>

</body>
</html>
