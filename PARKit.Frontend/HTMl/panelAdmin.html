<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Global Admin — PARKit</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="stylesheet" href="../STYLES/global.css" />
    <link rel="stylesheet" href="../STYLES/empresas.css" />
    <script src="../JS/global.js"></script>
    <script src="../JS/auth.js"></script>
</head>
<body class="min-h-screen text-gray-900">
    
    <!-- HEADER LIMPIO (Sin Icono de Escudo) -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md shadow-sm border-b border-[#e05d47]/20">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
            <a href="index.html" class="flex items-center gap-2 text-black font-black text-2xl tracking-tight">
                PARKit <span class="text-[#e05d47] font-light">Admin</span>
            </a>
            <div id="enlaces-auth" class="flex items-center gap-4"></div>
        </div>
    </header>

    <main class="w-full max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row gap-8">
        
        <!-- NAVEGACIÓN LATERAL -->
        <aside class="md:w-64 flex-shrink-0 flex flex-col gap-2">
            <button class="nav-admin text-left px-4 py-3 rounded-xl font-bold flex items-center gap-3 transition-all bg-[#e05d47] text-white shadow-lg shadow-[#e05d47]/30" data-tab="tab-empresas">
                <span class="material-symbols-outlined">store</span>
                Empresas
            </button>
            <button class="nav-admin text-left px-4 py-3 rounded-xl font-bold flex items-center gap-3 text-black/70 hover:text-black hover:bg-black/5 transition-all" data-tab="tab-usuarios">
                <span class="material-symbols-outlined">group</span>
                Usuarios
            </button>
            <button class="nav-admin text-left px-4 py-3 rounded-xl font-bold flex items-center gap-3 text-black/70 hover:text-black hover:bg-black/5 transition-all" data-tab="tab-res-usuarios">
                <span class="material-symbols-outlined">person_pin</span>
                Reservas por Usuario
            </button>
            <button class="nav-admin text-left px-4 py-3 rounded-xl font-bold flex items-center gap-3 text-black/70 hover:text-black hover:bg-black/5 transition-all" data-tab="tab-res-empresas">
                <span class="material-symbols-outlined">business</span>
                Reservas por Empresa
            </button>
        </aside>

        <!-- ÁREA DE CONTENIDO -->
        <div class="flex-1 flex flex-col gap-6">
            
            <section id="tab-empresas" class="tab-content block aparecer">
                <h2 class="text-3xl font-black tracking-tight mb-4">Gestión de Empresas</h2>
                <div class="bg-white rounded-2xl shadow-xl shadow-[#e05d47]/10 border border-[#e05d47]/10 overflow-hidden">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-gray-50 border-b border-gray-100 text-gray-500">
                            <tr>
                                <th class="px-6 py-4 font-bold uppercase tracking-wider text-[10px]">Nombre</th>
                                <th class="px-6 py-4 font-bold uppercase tracking-wider text-[10px]">CIF</th>
                                <th class="px-6 py-4 font-bold uppercase tracking-wider text-[10px]">Contacto</th>
                                <th class="px-6 py-4 font-bold uppercase tracking-wider text-[10px]">Estado</th>
                                <th class="px-6 py-4 font-bold uppercase tracking-wider text-[10px] text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="lista-empresas" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </section>

            <section id="tab-usuarios" class="tab-content hidden aparecer">
                <h2 class="text-3xl font-black tracking-tight mb-4">Directorio de Usuarios</h2>
                <div class="bg-white rounded-2xl shadow-xl shadow-[#e05d47]/10 border border-[#e05d47]/10 overflow-hidden">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-gray-50 border-b border-gray-100 text-gray-500">
                            <tr>
                                <th class="px-6 py-4 font-bold uppercase tracking-wider text-[10px]">Nombre</th>
                                <th class="px-6 py-4 font-bold uppercase tracking-wider text-[10px]">Email</th>
                                <th class="px-6 py-4 font-bold uppercase tracking-wider text-[10px]">Teléfono</th>
                                <th class="px-6 py-4 font-bold uppercase tracking-wider text-[10px]">Estado</th>
                                <th class="px-6 py-4 font-bold uppercase tracking-wider text-[10px] text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="lista-usuarios" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </section>

            <section id="tab-res-usuarios" class="tab-content hidden aparecer">
                <h2 class="text-3xl font-black tracking-tight mb-4">Reservas Clasificadas por Usuario</h2>
                <div class="bg-white rounded-2xl shadow-xl shadow-[#e05d47]/10 border border-[#e05d47]/10 p-6">
                    <div id="lista-reservas-usuarios" class="flex flex-col gap-6"></div>
                </div>
            </section>

            <section id="tab-res-empresas" class="tab-content hidden aparecer">
                <h2 class="text-3xl font-black tracking-tight mb-4">Reservas Clasificadas por Empresa</h2>
                <div class="bg-white rounded-2xl shadow-xl shadow-[#e05d47]/10 border border-[#e05d47]/10 p-6">
                    <div id="lista-reservas-empresas" class="flex flex-col gap-6"></div>
                </div>
            </section>

        </div>
    </main>
    <div id="contenedor-toast"></div>
    <script src="../JS/admin.js"></script>
</body>
</html>
