<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta — PARKit</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="../JS/global.js"></script>
    <script src="../JS/auth.js"></script>
    <link rel="stylesheet" href="../STYLES/global.css" />
</head>

<body class="layout-base">

    <!-- CABECERA -->
    <header class="header-base">
        <div class="max-w-6xl mx-auto flex items-center justify-between px-6 py-4">
            <a href="index.html" class="flex items-center gap-2 texto-primario font-black text-xl tracking-tight">
                <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 48 48" aria-hidden="true">
                    <path clip-rule="evenodd" fill-rule="evenodd"
                          d="M24 18.4228L42 11.475V34.3663C42 34.7796 41.7457 35.1504 41.3601 35.2992L24 42V18.4228Z"/>
                    <path clip-rule="evenodd" fill-rule="evenodd"
                          d="M24 8.18819L33.4123 11.574L24 15.2071L14.5877 11.574L24 8.18819ZM9 15.8487L21 20.4805V37.6263L9 32.9945V15.8487ZM27 37.6263V20.4805L39 15.8487V32.9945L27 37.6263ZM25.354 2.29885C24.4788 1.98402 23.5212 1.98402 22.646 2.29885L4.98454 8.65208C3.7939 9.08038 3 10.2097 3 11.475V34.3663C3 36.0196 4.01719 37.5026 5.55962 38.098L22.9197 44.7987C23.6149 45.0671 24.3851 45.0671 25.0803 44.7987L42.4404 38.098C43.9828 37.5026 45 36.0196 45 34.3663V11.475C45 10.2097 44.2061 9.08038 43.0155 8.65208L25.354 2.29885Z"/>
                </svg>
                PARKit
            </a>
        </div>
    </header>

    <!-- Botón volver -->
    <div class="fixed top-[65px] left-0 p-4 md:p-6 z-50">
        <a href="index.html"
           class="btn btn-ghost btn-sm inline-flex items-center gap-1 bg-white/80 dark:bg-[#0e1120]/80 backdrop-blur-md border border-[var(--borde)] shadow-sm md:bg-transparent md:dark:bg-transparent md:backdrop-blur-none md:border-none md:shadow-none">
            <span class="material-symbols-outlined text-sm">arrow_back</span>
            Volver al inicio
        </a>
    </div>

    <main class="flex-1 flex items-center justify-center px-6 py-6 md:py-10">
        <div class="card w-full max-w-md p-8 flex flex-col gap-6 aparecer">

            <!-- Logo + título -->
            <div class="flex flex-col items-center gap-3 text-center">
                <a href="index.html" class="flex items-center gap-2 text-primario font-black text-2xl tracking-tight">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 48 48">
                        <path clip-rule="evenodd" d="M24 18.4228L42 11.475V34.3663C42 34.7796 41.7457 35.1504 41.3601 35.2992L24 42V18.4228Z" fill-rule="evenodd"/>
                        <path clip-rule="evenodd" d="M24 8.18819L33.4123 11.574L24 15.2071L14.5877 11.574L24 8.18819ZM9 15.8487L21 20.4805V37.6263L9 32.9945V15.8487ZM27 37.6263V20.4805L39 15.8487V32.9945L27 37.6263ZM25.354 2.29885C24.4788 1.98402 23.5212 1.98402 22.646 2.29885L4.98454 8.65208C3.7939 9.08038 3 10.2097 3 11.475V34.3663C3 36.0196 4.01719 37.5026 5.55962 38.098L22.9197 44.7987C23.6149 45.0671 24.3851 45.0671 25.0803 44.7987L42.4404 38.098C43.9828 37.5026 45 36.0196 45 34.3663V11.475C45 10.2097 44.2061 9.08038 43.0155 8.65208L25.354 2.29885Z" fill-rule="evenodd"/>
                    </svg>
                    PARKit
                </a>
                <div>
                    <h1 class="text-xl font-bold tracking-tight mt-2">Crea tu cuenta</h1>
                    <p class="text-sm text-[var(--texto-suave)] mt-1">Únete a la red inteligente de aparcamientos</p>
                </div>
            </div>

            <!-- Tabs conductor / empresa -->
            <div class="flex p-1 rounded-xl bg-[#f5f6fa] dark:bg-[#0e1120] border border-[var(--borde)]">
                <button
                    type="button"
                    id="reg-tab-conductor"
                    class="flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-white dark:bg-[#161b2e] shadow-sm text-primario"
                >
                    Soy Conductor
                </button>
                <button
                    type="button"
                    id="reg-tab-empresa"
                    class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-[var(--texto-suave)] hover:text-[#111318] dark:hover:text-white"
                >
                    Tengo un Parking
                </button>
            </div>

            <!-- Formulario de registro -->
            <form id="form-registro" class="flex flex-col gap-4" novalidate>

                <!-- ── Campos comunes ── -->

                <!-- Nombre / Razón social -->
                <div class="flex flex-col gap-1.5">
                    <label for="reg-nombre"
                           id="reg-label-nombre"
                           class="text-xs font-semibold uppercase tracking-wider text-[var(--texto-suave)]">
                        Nombre completo
                    </label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-sm text-[var(--texto-suave)]">person</span>
                        <input
                            type="text"
                            id="reg-nombre"
                            required
                            placeholder="Juan Pérez"
                            autocomplete="name"
                            class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-[var(--borde)] bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-primario/20 focus:border-primario transition-colors placeholder:text-[var(--texto-suave)]/50"
                        />
                    </div>
                </div>

                <!-- Email -->
                <div class="flex flex-col gap-1.5">
                    <label for="reg-email"
                           class="text-xs font-semibold uppercase tracking-wider text-[var(--texto-suave)]">
                        Correo electrónico
                    </label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-sm text-[var(--texto-suave)]">mail</span>
                        <input
                            type="email"
                            id="reg-email"
                            required
                            placeholder="juan@email.com"
                            autocomplete="email"
                            class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-[var(--borde)] bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-primario/20 focus:border-primario transition-colors placeholder:text-[var(--texto-suave)]/50"
                        />
                    </div>
                </div>

                <!-- ── Campos exclusivos empresa ── -->
                <div id="campos-empresa" class="hidden flex-col gap-4">

                    <!-- CIF -->
                    <div class="flex flex-col gap-1.5">
                        <label for="reg-cif"
                               class="text-xs font-semibold uppercase tracking-wider text-[var(--texto-suave)]">
                            CIF de empresa
                        </label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-sm text-[var(--texto-suave)]">badge</span>
                            <input
                                type="text"
                                id="reg-cif"
                                placeholder="B12345678"
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-[var(--borde)] bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-primario/20 focus:border-primario transition-colors placeholder:text-[var(--texto-suave)]/50 uppercase"
                            />
                        </div>
                    </div>

                </div>

                <!-- Contraseña -->
                <div class="flex flex-col gap-1.5">
                    <label for="reg-password"
                           class="text-xs font-semibold uppercase tracking-wider text-[var(--texto-suave)]">
                        Contraseña
                    </label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-sm text-[var(--texto-suave)]">lock</span>
                        <input
                            type="password"
                            id="reg-password"
                            required
                            minlength="8"
                            placeholder="Mín. 8 caracteres"
                            autocomplete="new-password"
                            class="w-full pl-10 pr-10 py-2.5 rounded-lg border border-[var(--borde)] bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-primario/20 focus:border-primario transition-colors placeholder:text-[var(--texto-suave)]/50"
                        />
                        <button
                            type="button"
                            id="btn-ver-reg-password"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--texto-suave)] hover:text-[var(--texto)] transition-colors"
                            aria-label="Mostrar contraseña"
                        >
                            <span class="material-symbols-outlined text-sm" id="icono-ver-reg-password">visibility</span>
                        </button>
                    </div>
                    <!-- Indicador de fortaleza -->
                    <div class="flex gap-1 mt-1" id="indicador-fortaleza" aria-hidden="true">
                        <div class="h-1 flex-1 rounded-full bg-[var(--borde)] transition-all" id="f1"></div>
                        <div class="h-1 flex-1 rounded-full bg-[var(--borde)] transition-all" id="f2"></div>
                        <div class="h-1 flex-1 rounded-full bg-[var(--borde)] transition-all" id="f3"></div>
                        <div class="h-1 flex-1 rounded-full bg-[var(--borde)] transition-all" id="f4"></div>
                    </div>
                    <p id="texto-fortaleza" class="text-xs text-[var(--texto-suave)] hidden"></p>
                </div>

                <!-- Mensaje de error -->
                <p id="reg-error"
                   class="hidden text-sm text-[var(--rojo)] font-medium text-center bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900/40 rounded-lg px-4 py-2.5">
                </p>

                <!-- Mensaje de éxito (para empresa, que redirige a login) -->
                <p id="reg-exito"
                   class="hidden text-sm text-[var(--verde)] font-medium text-center bg-green-50 dark:bg-green-950/20 border border-green-200 dark:border-green-900/40 rounded-lg px-4 py-2.5">
                </p>

                <!-- Botón submit -->
                <button type="submit" id="btn-registro" class="btn btn-primario btn-lg w-full mt-2">
                    <span class="material-symbols-outlined text-base" id="icono-btn-registro">person_add</span>
                    <span id="texto-btn-registro">Crear cuenta</span>
                </button>

            </form>

            <div class="h-px bg-[var(--borde)] w-full"></div>

            <p class="text-sm text-[var(--texto-suave)] text-center">
                ¿Ya tienes una cuenta?
                <a href="login.html" class="text-primario font-bold hover:underline ml-1">Inicia sesión</a>
            </p>

        </div>
    </main>

    <footer class="py-6 text-center text-xs text-[var(--texto-suave)] border-t border-[var(--borde)] bg-white/50 dark:bg-[#0e1120]/50 backdrop-blur-sm">
        <p>© 2026 PARKit — TFG DAW · Juan Carlos Pina Esteban</p>
    </footer>

    <div id="contenedor-toast"></div>

    <script>
    (() => {
        // ── Estado ────────────────────────────────────────
        let modoActual = 'conductor'; // 'conductor' | 'empresa'

        // ── Redirigir si ya hay sesión activa ─────────────
        if (AUTH.estaAutenticado()) {
            window.location.href = AUTH.esEmpresa()
                ? './EMPRESA/panelEmpresa.html'
                : 'index.html';
        }

        // ── Referencias ───────────────────────────────────
        const tabConductor   = document.getElementById('reg-tab-conductor');
        const tabEmpresa     = document.getElementById('reg-tab-empresa');
        const camposEmpresa  = document.getElementById('campos-empresa');
        const labelNombre    = document.getElementById('reg-label-nombre');
        const inputNombre    = document.getElementById('reg-nombre');
        const inputCif       = document.getElementById('reg-cif');
        const btnRegistro    = document.getElementById('btn-registro');
        const textoBtn       = document.getElementById('texto-btn-registro');
        const iconoBtn       = document.getElementById('icono-btn-registro');
        const errorEl        = document.getElementById('reg-error');
        const exitoEl        = document.getElementById('reg-exito');

        // ── Toggle contraseña visible ─────────────────────
        document.getElementById('btn-ver-reg-password')?.addEventListener('click', () => {
            const input = document.getElementById('reg-password');
            const icono = document.getElementById('icono-ver-reg-password');
            const visible = input.type === 'text';
            input.type    = visible ? 'password' : 'text';
            icono.textContent = visible ? 'visibility' : 'visibility_off';
        });

        // ── Indicador de fortaleza de contraseña ──────────
        document.getElementById('reg-password')?.addEventListener('input', (e) => {
            const val = e.target.value;
            let nivel = 0;
            if (val.length >= 8)           nivel++;
            if (/[A-Z]/.test(val))         nivel++;
            if (/[0-9]/.test(val))         nivel++;
            if (/[^A-Za-z0-9]/.test(val))  nivel++;

            const colores = ['bg-[var(--rojo)]', 'bg-[var(--naranja)]', 'bg-[var(--naranja)]', 'bg-[var(--verde)]'];
            const textos  = ['Muy débil', 'Débil', 'Aceptable', 'Segura'];

            for (let i = 1; i <= 4; i++) {
                const barra = document.getElementById(`f${i}`);
                barra.className = 'h-1 flex-1 rounded-full transition-all ' +
                    (i <= nivel ? colores[nivel - 1] : 'bg-[var(--borde)]');
            }

            const textoF = document.getElementById('texto-fortaleza');
            if (val.length > 0) {
                textoF.textContent = textos[nivel - 1] || 'Muy débil';
                textoF.classList.remove('hidden');
            } else {
                textoF.classList.add('hidden');
            }
        });

        // ── Cambio de tab ─────────────────────────────────
        function activarTab(modo) {
            modoActual = modo;
            const esEmpresa = modo === 'empresa';

            const clsActivo   = ['bg-white', 'dark:bg-[#161b2e]', 'shadow-sm', 'text-primario'];
            const clsInactivo = ['text-[var(--texto-suave)]', 'hover:text-[#111318]', 'dark:hover:text-white'];

            if (esEmpresa) {
                tabEmpresa.classList.add(...clsActivo);
                tabEmpresa.classList.remove(...clsInactivo);
                tabConductor.classList.remove(...clsActivo);
                tabConductor.classList.add(...clsInactivo);

                // Mostrar campos empresa
                camposEmpresa.classList.remove('hidden');
                camposEmpresa.classList.add('flex');
                inputCif.required = true;

                // Adaptar etiquetas
                labelNombre.textContent       = 'Razón social';
                inputNombre.placeholder       = 'Parkings S.L.';
                textoBtn.textContent          = 'Registrar empresa';
                iconoBtn.textContent          = 'business';

            } else {
                tabConductor.classList.add(...clsActivo);
                tabConductor.classList.remove(...clsInactivo);
                tabEmpresa.classList.remove(...clsActivo);
                tabEmpresa.classList.add(...clsInactivo);

                // Ocultar campos empresa
                camposEmpresa.classList.add('hidden');
                camposEmpresa.classList.remove('flex');
                inputCif.required = false;

                // Restaurar etiquetas
                labelNombre.textContent       = 'Nombre completo';
                inputNombre.placeholder       = 'Juan Pérez';
                textoBtn.textContent          = 'Crear cuenta';
                iconoBtn.textContent          = 'person_add';
            }

            ocultarMensajes();
        }

        tabConductor.addEventListener('click', () => activarTab('conductor'));
        tabEmpresa.addEventListener('click',   () => activarTab('empresa'));

        // ── Mensajes ──────────────────────────────────────
        function mostrarError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.remove('hidden');
            exitoEl.classList.add('hidden');
        }

        function mostrarExito(msg) {
            exitoEl.textContent = msg;
            exitoEl.classList.remove('hidden');
            errorEl.classList.add('hidden');
        }

        function ocultarMensajes() {
            errorEl.classList.add('hidden');
            exitoEl.classList.add('hidden');
        }

        // ── Estado de carga del botón ─────────────────────
        function setCargando(activo) {
            btnRegistro.disabled  = activo;
            iconoBtn.textContent  = activo ? 'hourglass_top' : (modoActual === 'empresa' ? 'business' : 'person_add');
            textoBtn.textContent  = activo ? 'Creando cuenta...' : (modoActual === 'empresa' ? 'Registrar empresa' : 'Crear cuenta');
            if (activo) iconoBtn.classList.add('animate-spin');
            else        iconoBtn.classList.remove('animate-spin');
        }

        // ── Validaciones básicas ──────────────────────────
        function validar() {
            const nombre   = document.getElementById('reg-nombre').value.trim();
            const email    = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            if (!nombre)                       return 'El nombre es obligatorio.';
            if (!email)                        return 'El correo electrónico es obligatorio.';
            if (!/\S+@\S+\.\S+/.test(email))   return 'El formato del correo no es válido.';
            if (password.length < 8)           return 'La contraseña debe tener al menos 8 caracteres.';

            if (modoActual === 'empresa') {
                const cif = document.getElementById('reg-cif').value.trim();
                if (!cif)                      return 'El CIF de empresa es obligatorio.';
            }

            return null; // sin errores
        }

        // ── Envío del formulario ──────────────────────────
        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            ocultarMensajes();

            const error = validar();
            if (error) { mostrarError(error); return; }

            const nombre   = document.getElementById('reg-nombre').value.trim();
            const email    = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            setCargando(true);

            try {
                if (modoActual === 'conductor') {
                    // Registro usuario → auto-login → inicio
                    await AUTH.registrarUsuario(nombre, email, password);
                    window.location.href = 'index.html';

                } else {
                    // Registro empresa → no hay auto-login → redirigir a login
                    const cif = document.getElementById('reg-cif').value.trim().toUpperCase();
                    await AUTH.registrarEmpresa(nombre, cif, email, password);

                    mostrarExito('¡Empresa registrada! Redirigiendo al inicio de sesión…');
                    setTimeout(() => {
                        window.location.href = 'login.html?tipo=empresa';
                    }, 2000);
                }

            } catch (err) {
                mostrarError(err.message || 'Ha ocurrido un error. Inténtalo de nuevo.');
                setCargando(false);
            }
        });

        // ── Pre-seleccionar tab si viene por URL ──────────
        const params = new URLSearchParams(window.location.search);
        if (params.get('tipo') === 'empresa') activarTab('empresa');

    })();
    </script>

</body>
</html>
